<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frosty Tunes | Seasonal Radio Bot for Discord</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0088ff;
            --primary-hover: #0066cc;
            --bg-dark: #0b111e;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            /* Links to your uploaded background photo filename */
            background: linear-gradient(rgba(11, 17, 30, 0.75), rgba(11, 17, 30, 0.85)), 
                        url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* FALLING SNOW CANVAS */
        #snowflake-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* HEADER / NAV */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 8%;
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(11, 17, 30, 0.85);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-img {
            height: 40px;
            width: auto;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--primary-blue);
            transition: color 0.2s ease;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 5rem 1rem 3rem 1rem;
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 20;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1.2rem;
            background: rgba(0, 136, 255, 0.15);
            border: 1px solid rgba(0, 136, 255, 0.3);
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.2rem;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
